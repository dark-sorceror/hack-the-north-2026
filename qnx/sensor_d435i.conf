# QNX Sensor Framework config for a RealSense D435i on the Pi 5's USB 3 port.
# Based on the image's /etc/config/sensor/usb/d435_z16_ycbycr.conf (a D435,
# product 0x0b07). The D435i is product 0x0b3a; check yours with `usb -v`.
# Both streams 848x480 (16:9, the depth camera's full field of view) at 30 fps.
#
# Unit 1 = depth, unit 2 = colour: camtap's defaults (-d 1 -c 2).
# Restart the sensor service with this file (as root; until the next boot):
#   slay sensor
#   sensor -U 521:521 -b external -r /data/share/sensor -c /data/home/qnxuser/supervisor/sensor_d435i.conf
# -b external needs the platform section, as in /etc/config/sensor/sensor_rpi5.conf.
begin SENSOR_GLOBAL
    external_platform_library_path = libsensor_platform_broadcom_rpi5.so
    external_platform_library_variant = PLATFORM_VARIANT_BCM2712
end SENSOR_GLOBAL
begin SENSOR_UNIT_1
    type = usb_camera
    name = d435i_z16
    default_video_format = z16
    default_video_resolution = 848, 480
    default_video_framerate = 30
    control_interface_number = 1
    memory_allocator_type = from_sensor
    create_window = false
    address = /dev/usb/io-usb-otg, -1, -1, 0x8086, 0x0b3a
end SENSOR_UNIT_1
begin SENSOR_UNIT_2
    type = usb_camera
    name = d435i_ycbycr
    default_video_format = ycbycr
    default_video_resolution = 848, 480
    default_video_framerate = 30
    control_interface_number = 4
    address = /dev/usb/io-usb-otg, -1, -1, 0x8086, 0x0b3a
end SENSOR_UNIT_2
