[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-htn"
version = "0.1.0"
description = "WebSocket voice and task coordination for a multi-Pi robot"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<16", "pydantic>=2.10,<3"]

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<0.6"]
camera = ["numpy>=2,<3", "pillow>=10,<13", "ultralytics>=8.3,<9"]
camera-realsense = ["pyrealsense2>=2.56"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["robot_app*", "vla_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
