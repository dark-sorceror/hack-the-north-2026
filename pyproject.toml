[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retriever"
version = "0.1.0"
description = "A robot that finds things, decides what to do with them, and acts"
requires-python = ">=3.10"
# The core, the Pi bridge and the navigation stack are stdlib-only by design.
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<0.6"]
camera = ["numpy>=2,<3", "pillow>=10,<13"]
camera-realsense = ["pyrealsense2>=2.56"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["retriever*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
